id: io.github.yfilali.DynonUSBUpdater
runtime: org.gnome.Platform
runtime-version: "49"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: dynon-usb-updater

# Exactly the permissions justified in docs/PUBLISHING.md §4: udisks mounts
# removable drives at /run/media/$USER, which no XDG portal can enumerate or
# write to, so --filesystem=/run/media is required; the file-chooser-portal
# fallback (Choose Folder…) covers users who would rather grant one
# directory at a time. Nothing broader is requested.
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=/run/media
  - --filesystem=xdg-download:ro

modules:
  - name: dynon-usb-updater
    buildsystem: meson
    config-opts:
      - -Dbuildtype=release
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/dynon-usb-updater/cargo
    sources:
      - type: git
        url: https://github.com/yfilali/dynon-usb-updater.git
        branch: main
      # Generated by flatpak-cargo-generator.py from Cargo.lock — vendors
      # every crates.io dependency as an offline source so the sandboxed
      # build phase (no network) can still `cargo build`. Regenerate with:
      #   uv run flatpak-cargo-generator.py Cargo.lock -o build-aux/cargo-sources.json
      - cargo-sources.json
